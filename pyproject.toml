[project]
name = "cpcell"
version = "0.1.0"
description = "CP-SAT based Standard Cell Layout Generator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "ABKGroup and chchengucsd" },
]
dependencies = [
    "absl-py",
    "klayout>=0.30",
    "matplotlib",
    "networkx",
    "numpy",
    "ortools>=9.14",
    "scikit-learn",
]

[project.scripts]
cpcell = "src.main:main"
cpcell-config = "src.utility.config:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
